<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JoseloPelo Live</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina">

        <h1>JOSELOPELO</h1>

        <div class="contenido">

            <!-- DIRECTO -->
           <section class="directo">

    <!-- Reproductor -->
    <div id="twitch-player"></div>

 <!-- Pantalla OFFLINE -->
<div id="offline" class="offline oculto">

    <div class="botones-offline">

        <a
            href="https://www.twitch.tv/joselopelo"
            target="_blank"
            rel="noopener noreferrer"
            class="boton-social">
            Twitch
        </a>

        <a
            href="TU_ENLACE_DISCORD"
            target="_blank"
            rel="noopener noreferrer"
            class="boton-social">
            Discord
        </a>

    </div>

</div>

               
</section>


            <!-- CHAT -->
            <section class="chat">

                <h2>💬 Chat de la comunidad</h2>

                <div id="mensajes">
                    <p>
                        <strong>JP Bot:</strong>
                        Bienvenido a la ronda 🧉
                    </p>
                </div>

                <div class="entrada">

                    <input
                        id="mensaje"
                        type="text"
                        placeholder="Escribe un mensaje..."
                    >

                    <button id="enviar">
                        Enviar
                    </button>

                </div>

            </section>

        </div>

    </main>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script src="script.js"></script>

</body>

</html>
