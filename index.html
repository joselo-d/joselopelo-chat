<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JoseloPelo Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat">

        <h1>JOSELOPELO</h1>

        <h2>💬 Chat de la comunidad</h2>

        <div id="mensajes">

            <p>
                <strong>JP Bot:</strong>
                Bienvenido a la ronda 🧉
            </p>

        </div>

        <div class="entrada">

            <input
                id="mensaje"
                type="text"
                placeholder="Escribe un mensaje..."
            >

            <button id="enviar">
                Enviar
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
